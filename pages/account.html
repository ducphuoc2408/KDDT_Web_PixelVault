<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài khoản - PixelVault</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4a843' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z'/><circle cx='12' cy='13' r='4'/></svg>">
</head>
<body>

<nav class="navbar" id="main-navbar">
  <div class="nav-container">
    <a href="../index.html" class="nav-logo">
      <div class="logo-mark">
        <svg class="logo-icon-svg" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
      <span class="logo-text">PixelVault</span>
    </a>
    <div class="nav-links">
      <a href="../index.html" class="nav-link">Trang chủ</a>
      <a href="products.html" class="nav-link">Sản phẩm</a>
      <a href="compare.html" class="nav-link">So sánh</a>
      <a href="contact.html" class="nav-link">Liên hệ</a>
    </div>
                <div class="nav-actions">
      <div class="nav-search" id="nav-search-bar">
        <input class="nav-search-input" id="nav-q" placeholder="Tìm kiếm máy ảnh..." 
          onkeypress="if(event.key==='Enter') window.location.href='products.html?q='+this.value">
        <button class="nav-search-btn" id="btn-nav-search"
          onclick="window.location.href='products.html?q='+document.getElementById('nav-q').value">
          <svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </div>
      <button class="nav-icon-btn" onclick="toggleTheme()" title="Đổi giao diện" aria-label="Đổi giao diện">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <button class="nav-icon-btn" id="btn-cart" onclick="cartOpen()" title="Giỏ hàng" aria-label="Giỏ hàng">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-badge" id="cart-badge-nav" style="display:none;">0</span>
      </button>
      
      <div style="position:relative;" id="user-menu-container">
        <button class="nav-icon-btn" id="btn-user" style="display:none;" title="Tài khoản" onclick="toggleUserDropdown()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
        <div class="user-dropdown" id="user-dropdown" style="display:none; position:absolute; top:50px; right:0; background:var(--bg-elevated); border:1px solid var(--border-1); border-radius:var(--r-md); padding:8px 0; min-width:180px; flex-direction:column; box-shadow:var(--shadow-lg); z-index:100;">
          <a href="account.html" id="user-dropdown-name" style="padding:10px 16px; color:var(--text-200); text-decoration:none; font-size:0.9rem;" onmouseover="this.style.background='var(--bg-card)'" onmouseout="this.style.background='transparent'">Tài khoản của tôi</a>
          <div style="height:1px; background:var(--border-1); margin:4px 0;"></div>
          <a href="#" onclick="logout()" style="padding:10px 16px; color:var(--danger); text-decoration:none; font-size:0.9rem;" onmouseover="this.style.background='var(--bg-card)'" onmouseout="this.style.background='transparent'">Đăng xuất</a>
        </div>
      </div>

      <button class="btn btn-nav-login" id="btn-login" onclick="openModal('auth-modal')">Đăng nhập</button>
    </div>
  </div>
</nav>

<div class="section" style="margin-top: var(--nav-h); min-height: 70vh;">
  <div class="container">
    <div style="display:grid; grid-template-columns: 280px 1fr; gap: 32px; align-items: start;">
      
      <!-- Sidebar -->
      <aside style="background:var(--bg-card); border:1px solid var(--border-1); border-radius:var(--r-lg); padding:24px;">
        <div style="display:flex; flex-direction:column; align-items:center; border-bottom:1px solid var(--border-1); padding-bottom:24px; margin-bottom:24px;">
          <div style="width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg, var(--gold-600), var(--gold-400)); display:flex; align-items:center; justify-content:center; font-family:'Outfit',sans-serif; font-weight:800; font-size:2rem; color:#06060d; margin-bottom:16px;" id="acc-avatar">U</div>
          <div style="font-weight:700; font-size:1.1rem; color:var(--text-100);" id="acc-name">User</div>
          <div style="font-size:0.875rem; color:var(--text-400);" id="acc-email">user@example.com</div>
        </div>

        <nav style="display:flex; flex-direction:column; gap:4px;">
          <a href="#" class="admin-nav-item active" style="padding:10px 14px;" onclick="switchTab('profile', this)">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Hồ sơ của tôi
          </a>
          <a href="#" class="admin-nav-item" style="padding:10px 14px;" onclick="switchTab('orders', this)">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Đơn hàng
          </a>
          <a href="#" class="admin-nav-item" style="padding:10px 14px;" onclick="switchTab('wishlist', this)">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            Yêu thích
          </a>
          <a href="../admin/index.html" class="admin-nav-item" id="sidebar-admin-link" style="display:none; padding:10px 14px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Trang quản trị
          </a>
          <a href="#" onclick="logout()" class="admin-nav-item" style="padding:10px 14px; color:var(--danger); border-top:1px solid var(--border-1); margin-top:10px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Đăng xuất
          </a>
        </nav>
      </aside>

      <!-- Content -->
      <main>
        <!-- Profile -->
        <div id="tab-profile" style="background:var(--bg-card); border:1px solid var(--border-1); border-radius:var(--r-lg); padding:32px;">
          <h2 style="font-size:1.25rem; font-family:'Outfit',sans-serif; color:var(--text-100); margin-bottom:24px;">Hồ sơ cá nhân</h2>
          <form onsubmit="saveProfile(event)" style="max-width:500px;">
            <div class="form-group">
              <label class="form-label">Họ và tên</label>
              <input type="text" class="form-input" id="pf-name" required>
            </div>
            <div class="form-group">
              <label class="form-label">Email (Không thể thay đổi)</label>
              <input type="email" class="form-input" id="pf-email" disabled>
            </div>
            <div class="form-group">
              <label class="form-label">Số điện thoại</label>
              <input type="tel" class="form-input" id="pf-phone" placeholder="Cập nhật số điện thoại...">
            </div>
            <div class="form-group">
              <label class="form-label">Địa chỉ mặc định</label>
              <input type="text" class="form-input" id="pf-address" placeholder="Cập nhật địa chỉ...">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:16px;">Lưu thay đổi</button>
          </form>
        </div>

        <!-- Orders -->
        <div id="tab-orders" style="display:none; background:var(--bg-card); border:1px solid var(--border-1); border-radius:var(--r-lg); padding:32px;">
          <h2 style="font-size:1.25rem; font-family:'Outfit',sans-serif; color:var(--text-100); margin-bottom:24px;">Lịch sử đơn hàng</h2>
          <div class="data-table-wrap" style="margin:0; border:none; padding:0;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Mã đơn</th>
                  <th>Ngày đặt</th>
                  <th>Sản phẩm</th>
                  <th>Tổng tiền</th>
                  <th>Trạng thái</th>
                </tr>
              </thead>
              <tbody id="user-orders-list"></tbody>
            </table>
          </div>
        </div>

        <!-- Wishlist -->
        <div id="tab-wishlist" style="display:none; background:var(--bg-card); border:1px solid var(--border-1); border-radius:var(--r-lg); padding:32px;">
          <h2 style="font-size:1.25rem; font-family:'Outfit',sans-serif; color:var(--text-100); margin-bottom:24px;">Sản phẩm yêu thích</h2>
          <div class="products-grid" id="wishlist-grid" style="grid-template-columns: repeat(3, 1fr);"></div>
        </div>
      </main>

    </div>
  </div>
</div>

<footer class="footer">
  <div class="footer-bottom">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; font-size:0.79rem; color:var(--text-500);">
      <span>© 2026 PixelVault. Đề án môn học.</span>
    </div>
  </div>
</footer>

<div class="toast-container" id="toast-container"></div>
<script src="../assets/js/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (!Store.currentUser) {
    window.location.href = '../index.html';
    return;
  }
  
  const u = Store.currentUser;
  document.getElementById('acc-name').textContent = u.name;
  document.getElementById('acc-avatar').textContent = u.name[0].toUpperCase();
  document.getElementById('acc-email').textContent = u.email;

  document.getElementById('pf-name').value = u.name;
  document.getElementById('pf-email').value = u.email;

  renderUserOrders(u.name);
  renderWishlist();
});

function switchTab(tabId, el) {
  document.querySelectorAll('.admin-nav-item').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  
  document.getElementById('tab-profile').style.display = 'none';
  document.getElementById('tab-orders').style.display = 'none';
  document.getElementById('tab-wishlist').style.display = 'none';
  
  document.getElementById(`tab-${tabId}`).style.display = 'block';
}

function saveProfile(e) {
  e.preventDefault();
  const newName = document.getElementById('pf-name').value;
  Store.currentUser.name = newName;
  saveStore();
  
  document.getElementById('acc-name').textContent = newName;
  document.getElementById('acc-avatar').textContent = newName[0].toUpperCase();
  
  showToast('Đã cập nhật hồ sơ cá nhân', 'success');
}

function renderUserOrders(userName) {
  const myOrders = Store.orders.filter(o => o.customer === userName);
  const tbody = document.getElementById('user-orders-list');
  const statusMap = {
    pending:    ['status-pending',    'Chờ xác nhận'],
    confirmed:  ['status-confirmed',  'Đã xác nhận'],
    processing: ['status-processing', 'Đang xử lý'],
    shipping:   ['status-shipping',   'Đang giao'],
    completed:  ['status-completed',  'Hoàn tất'],
    cancelled:  ['status-cancelled',  'Đã hủy'],
  };

  if (myOrders.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:40px; color:var(--text-400);">Bạn chưa có đơn hàng nào.</td></tr>`;
    return;
  }

  tbody.innerHTML = myOrders.map(o => {
    const [cls, label] = statusMap[o.status] || [];
    return `<tr>
      <td style="font-weight:700; color:var(--gold-400);">${o.id}</td>
      <td style="font-size:0.875rem; color:var(--text-300);">${o.date}</td>
      <td style="max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${o.product}</td>
      <td style="font-weight:700;">${formatPrice(o.total)}</td>
      <td><span class="order-status ${cls}">${label}</span></td>
    </tr>`;
  }).join('');
}

function renderWishlist() {
  const grid = document.getElementById('wishlist-grid');
  const items = Store.products.filter(p => Store.wishlist.includes(p.id));
  
  if (items.length === 0) {
    grid.style.display = 'block';
    grid.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-400);">Danh sách yêu thích trống.</div>`;
    return;
  }
  
  grid.style.display = 'grid';
  grid.innerHTML = items.map(p => renderProductCard(p)).join('');
}
</script>
</body>
</html>
