<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết sản phẩm - PixelVault</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4a843' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z'/><circle cx='12' cy='13' r='4'/></svg>">
</head>
<body>

<nav class="navbar" id="main-navbar">
  <div class="nav-container">
    <a href="../index.html" class="nav-logo">
      <div class="logo-mark">
        <svg class="logo-icon-svg" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
      <span class="logo-text">PixelVault</span>
    </a>
    <div class="nav-links">
      <a href="../index.html" class="nav-link">Trang chủ</a>
      <a href="products.html" class="nav-link active">Sản phẩm</a>
      <a href="compare.html" class="nav-link">So sánh</a>
      <a href="contact.html" class="nav-link">Liên hệ</a>
    </div>
                <div class="nav-actions">
      <div class="nav-search" id="nav-search-bar">
        <input class="nav-search-input" id="nav-q" placeholder="Tìm kiếm máy ảnh..." 
          onkeypress="if(event.key==='Enter') window.location.href='products.html?q='+this.value">
        <button class="nav-search-btn" id="btn-nav-search"
          onclick="window.location.href='products.html?q='+document.getElementById('nav-q').value">
          <svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </div>
      <button class="nav-icon-btn" onclick="toggleTheme()" title="Đổi giao diện" aria-label="Đổi giao diện">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <button class="nav-icon-btn" id="btn-cart" onclick="cartOpen()" title="Giỏ hàng" aria-label="Giỏ hàng">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-badge" id="cart-badge-nav" style="display:none;">0</span>
      </button>
      
      <div style="position:relative;" id="user-menu-container">
        <button class="nav-icon-btn" id="btn-user" style="display:none;" title="Tài khoản" onclick="toggleUserDropdown()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
        <div class="user-dropdown" id="user-dropdown" style="display:none; position:absolute; top:50px; right:0; background:var(--bg-elevated); border:1px solid var(--border-1); border-radius:var(--r-md); padding:8px 0; min-width:180px; flex-direction:column; box-shadow:var(--shadow-lg); z-index:100;">
          <a href="account.html" id="user-dropdown-name" style="padding:10px 16px; color:var(--text-200); text-decoration:none; font-size:0.9rem;" onmouseover="this.style.background='var(--bg-card)'" onmouseout="this.style.background='transparent'">Tài khoản của tôi</a>
          <div style="height:1px; background:var(--border-1); margin:4px 0;"></div>
          <a href="#" onclick="logout()" style="padding:10px 16px; color:var(--danger); text-decoration:none; font-size:0.9rem;" onmouseover="this.style.background='var(--bg-card)'" onmouseout="this.style.background='transparent'">Đăng xuất</a>
        </div>
      </div>

      <button class="btn btn-nav-login" id="btn-login" onclick="openModal('auth-modal')">Đăng nhập</button>
    </div>
  </div>
</nav>

<div style="margin-top: var(--nav-h); padding: 40px 0;">
  <div class="container" id="product-container">
    <div style="text-align:center; padding:100px 0;">
      <svg style="width:40px;height:40px;stroke:var(--gold-500);fill:none;animation:spin 1s linear infinite;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="4" stroke-dasharray="32" stroke-dashoffset="0"/></svg>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="footer-bottom">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; font-size:0.79rem; color:var(--text-500);">
      <span>© 2026 PixelVault. Đề án môn học.</span>
    </div>
  </div>
</footer>

<div class="cart-overlay" id="cart-overlay">
  <div class="cart-drawer">
    <div class="cart-header">
      <h3>Giỏ hàng</h3>
      <button class="cart-close" onclick="cartClose()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
      <div id="cart-total"></div>
      <a href="checkout.html" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:14px;">Thanh toán</a>
    </div>
  </div>
</div>

<div class="compare-bar" id="compare-bar">
  <span style="font-size:0.845rem; font-weight:600; color:var(--text-200);">So sánh</span>
  <div class="compare-items" id="compare-slots"></div>
  <button class="btn btn-primary btn-sm" onclick="goCompare()">So sánh ngay</button>
  <button class="btn btn-secondary btn-sm" onclick="Store.compareList=[];updateCompareBar();">Xóa</button>
</div>

<div class="modal-overlay" id="auth-modal">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header">
      <div class="modal-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      <h2 class="modal-title">Đăng nhập</h2>
    </div>
    <div class="modal-body">
      <form id="login-form">
        <div class="form-group"><input type="email" id="login-email" class="form-input" placeholder="Email"></div>
        <div class="form-group"><input type="password" id="login-password" class="form-input" placeholder="Mật khẩu"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Đăng nhập</button>
      </form>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/main.js"></script>
<script>
let currentProduct = null;
let currentQty = 1;

document.addEventListener('store:ready', async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const id = parseInt(urlParams.get('id')) || 1;
  // Lấy sản phẩm từ Supabase
  currentProduct = Store.products.find(p => p.id === id)
    || await window.SupabaseDB.getProductById(id);

  if (!currentProduct) {
    document.getElementById('product-container').innerHTML = `
      <div style="text-align:center; padding:100px 0;">
        <h2 style="font-family:'Outfit',sans-serif; font-size:2rem; margin-bottom:16px;">Không tìm thấy sản phẩm</h2>
        <a href="products.html" class="btn btn-primary">Quay lại cửa hàng</a>
      </div>`;
    return;
  }

  document.title = `${currentProduct.name} - PixelVault`;
  renderProductDetails();
});

function renderProductDetails() {
  const p = currentProduct;
  const isSale = p.originalPrice > p.price;
  
  // Breadcrumb
  const breadcrumb = `
    <div style="font-size:0.75rem; color:var(--text-400); margin-bottom:24px; display:flex; gap:8px;">
      <a href="../index.html">Trang chủ</a> 
      <svg style="width:12px;height:12px;stroke:currentColor;fill:none;" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      <a href="products.html?cat=${p.category}">${p.category}</a>
      <svg style="width:12px;height:12px;stroke:currentColor;fill:none;" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      <span style="color:var(--text-200);">${p.name}</span>
    </div>`;

  // Gallery
  const validImages = Array.isArray(p.images) && p.images.length > 0 ? p.images : [''];
  const mainImage = getProductImageSrc(validImages, false);
  const galleryThumbsHtml = validImages.map((img, idx) => {
    const src = getProductImageSrc([img], false);
    return `<div class="gallery-thumb ${idx === 0 ? 'active' : ''}"><img src="${src}"></div>`;
  }).join('');

  const galleryHtml = `
    <div>
      <div class="gallery-main" id="gallery-main">
        ${getBadgeHTML(p.badge)}
        <img src="${mainImage}" alt="${p.name}">
      </div>
      <div class="gallery-thumbs">
        ${galleryThumbsHtml}
      </div>
    </div>`;

  // Info
  const specsList = Object.entries(p.specs).slice(0, 4).map(([k,v]) => `<div style="font-size:0.8rem; color:var(--text-300); margin-bottom:6px;">• <b>${k}:</b> ${v}</div>`).join('');
  
  const infoHtml = `
    <div class="product-detail-info">
      <div class="product-detail-brand">${p.brand}</div>
      <h1 class="product-detail-name">${p.name}</h1>
      <div class="product-rating" style="margin-bottom:20px;">
        <div class="stars">${getStarsHTML(p.rating)}</div>
        <span class="rating-count">(${p.rating} / 5 từ ${p.reviews} đánh giá)</span>
      </div>
      
      <div style="display:flex; align-items:flex-end; gap:16px; margin-bottom:24px;">
        <div class="detail-price-current">${formatPrice(p.price)}</div>
        ${isSale ? `
          <div style="display:flex; flex-direction:column; padding-bottom:4px;">
            <div class="detail-price-save">Giảm ${formatPrice(p.originalPrice - p.price)}</div>
            <div class="detail-price-original">${formatPrice(p.originalPrice)}</div>
          </div>
        ` : ''}
      </div>

      <p style="font-size:0.9rem; color:var(--text-300); line-height:1.7; margin-bottom:24px;">${p.description}</p>
      
      <div style="background:var(--bg-card); border:1px solid var(--border-1); padding:16px; border-radius:var(--r-md); margin-bottom:32px;">
        <div style="font-weight:700; color:var(--text-100); margin-bottom:12px; font-size:0.85rem; text-transform:uppercase;">Cấu hình nổi bật</div>
        ${specsList}
      </div>

      <div style="display:flex; align-items:center; gap:16px; margin-bottom:24px;">
        <div class="qty-control" style="border-color:var(--border-2); height:48px;">
          <button class="qty-btn" style="width:40px;" onclick="changeLocalQty(-1)"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
          <span class="qty-value" id="detail-qty" style="width:40px; font-size:1rem;">1</span>
          <button class="qty-btn" style="width:40px;" onclick="changeLocalQty(1)"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        </div>
        <div style="flex:1;">
          <button class="btn btn-primary btn-lg" style="width:100%; justify-content:center;" 
            onclick="${p.stock > 0 ? `cartAdd(${p.id}, currentQty)` : ''}" ${p.stock === 0 ? 'disabled' : ''}>
            <svg style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            ${p.stock > 0 ? 'Thêm vào giỏ hàng' : 'Đã hết hàng'}
          </button>
        </div>
      </div>

      <div style="display:flex; gap:20px; border-top:1px solid var(--border-1); padding-top:24px;">
        <button class="btn btn-ghost" onclick="wishlistToggle(${p.id})">
          <svg style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> Yêu thích
        </button>
        <button class="btn btn-ghost" onclick="compareToggle(${p.id})">
          <svg style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg> So sánh
        </button>
      </div>

      <div style="margin-top:24px; padding:16px; background:rgba(212,168,67,0.06); border:1px solid var(--border-gold); border-radius:var(--r-md); display:flex; gap:12px; align-items:center;">
        <svg style="width:24px;height:24px;stroke:var(--gold-500);fill:none;flex-shrink:0;" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <div style="font-size:0.8rem; color:var(--gold-400);">
          <strong style="display:block; margin-bottom:2px;">Bảo hành chính hãng ${p.specs['Bảo hành'] || '12 tháng'}</strong>
          Giao hàng tận nơi miễn phí. Lỗi 1 đổi 1 trong 30 ngày.
        </div>
      </div>
    </div>`;

  document.getElementById('product-container').innerHTML = `
    ${breadcrumb}
    <div class="product-detail">
      ${galleryHtml}
      ${infoHtml}
    </div>
    ${renderSpecsAndReviews(p)}
  `;

  // Attach thumb events
  const thumbs = document.querySelectorAll('.gallery-thumb');
  const mainImg = document.querySelector('#gallery-main img');
  thumbs.forEach(thumb => {
    thumb.addEventListener('click', () => {
      thumbs.forEach(t => t.classList.remove('active'));
      thumb.classList.add('active');
      mainImg.src = thumb.querySelector('img').src;
      mainImg.style.filter = thumb.querySelector('img').style.filter;
    });
  });
}

function changeLocalQty(delta) {
  if (!currentProduct) return;
  const newQty = currentQty + delta;
  if (newQty >= 1 && newQty <= currentProduct.stock) {
    currentQty = newQty;
    document.getElementById('detail-qty').textContent = currentQty;
  } else if (newQty > currentProduct.stock) {
    showToast(`Chỉ còn ${currentProduct.stock} sản phẩm trong kho`, 'error');
  }
}

function renderSpecsAndReviews(p) {
  const specsHtml = Object.entries(p.specs).map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  
  return `
    <div style="margin-top:80px; border-top:1px solid var(--border-1); padding-top:48px;">
      <div style="display:flex; border-bottom:1px solid var(--border-1); margin-bottom:32px;">
        <button class="modal-tab active" onclick="switchTab(this, 'tab-specs')" style="font-size:1rem; padding:12px 24px;">Thông số kỹ thuật</button>
        <button class="modal-tab" onclick="switchTab(this, 'tab-reviews')" style="font-size:1rem; padding:12px 24px;">Đánh giá (${p.reviews})</button>
      </div>

      <div id="tab-specs">
        <table class="specs-table" style="max-width:800px;">
          ${specsHtml}
        </table>
      </div>

      <div id="tab-reviews" style="display:none; max-width:800px;">
        <div style="background:var(--bg-card); border:1px solid var(--border-1); padding:24px; border-radius:var(--r-lg); margin-bottom:32px;">
          <h3 style="font-size:1.1rem; color:var(--text-100); margin-bottom:16px;">Viết đánh giá của bạn</h3>
          <form onsubmit="submitReview(event)">
            <div style="margin-bottom:12px; color:var(--gold-400); display:flex; gap:4px; font-size:1.2rem; cursor:pointer;">
              ${'<svg style="width:20px;height:20px;fill:currentColor;stroke:none;" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'.repeat(5)}
            </div>
            <textarea class="form-input" rows="4" placeholder="Nhập đánh giá của bạn..." style="resize:vertical; margin-bottom:12px;" required></textarea>
            <button type="submit" class="btn btn-primary">Gửi đánh giá</button>
          </form>
        </div>

        <div style="display:flex; flex-direction:column; gap:20px;">
          <div style="padding-bottom:20px; border-bottom:1px solid var(--border-1);">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
              <div style="font-weight:700; color:var(--text-100);">Nguyễn Hoàng</div>
              <span style="font-size:0.75rem; color:var(--text-400);">2 ngày trước</span>
            </div>
            <div style="color:var(--gold-400); margin-bottom:10px; display:flex; gap:2px;">
              ${'<svg style="width:14px;height:14px;fill:currentColor;stroke:none;" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'.repeat(5)}
            </div>
            <p style="font-size:0.875rem; color:var(--text-300);">Sản phẩm chất lượng, đúng như mô tả. Đóng gói rất cẩn thận, giao hàng nhanh chóng.</p>
          </div>
          <div style="padding-bottom:20px; border-bottom:1px solid var(--border-1);">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
              <div style="font-weight:700; color:var(--text-100);">Trần Minh</div>
              <span style="font-size:0.75rem; color:var(--text-400);">1 tuần trước</span>
            </div>
            <div style="color:var(--gold-400); margin-bottom:10px; display:flex; gap:2px;">
              ${'<svg style="width:14px;height:14px;fill:currentColor;stroke:none;" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'.repeat(4)}
            </div>
            <p style="font-size:0.875rem; color:var(--text-300);">Giá cả hợp lý, nhân viên hỗ trợ nhiệt tình. Sẽ ủng hộ shop dài dài.</p>
          </div>
        </div>
      </div>
    </div>`;
}

function switchTab(btn, targetId) {
  document.querySelectorAll('.modal-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-specs').style.display = 'none';
  document.getElementById('tab-reviews').style.display = 'none';
  document.getElementById(targetId).style.display = 'block';
}

function submitReview(e) {
  e.preventDefault();
  if (!Store.currentUser) {
    openModal('auth-modal');
    return;
  }
  const btn = e.target.querySelector('button');
  btn.textContent = 'Đang gửi...';
  btn.disabled = true;
  setTimeout(() => {
    showToast('Đánh giá của bạn đã được gửi và đang chờ duyệt', 'success');
    e.target.reset();
    btn.textContent = 'Gửi đánh giá';
    btn.disabled = false;
  }, 1000);
}
</script>
</body>
</html>
