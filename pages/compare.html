<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>So sánh sản phẩm - PixelVault</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4a843' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z'/><circle cx='12' cy='13' r='4'/></svg>">
  <style>
    .compare-table-wrapper {
      width: 100%;
      overflow-x: auto;
      background: var(--bg-card);
      border: 1px solid var(--border-1);
      border-radius: var(--r-lg);
    }
    
    .compare-table {
      width: 100%;
      min-width: 800px;
      border-collapse: collapse;
      text-align: left;
    }

    .compare-table th, .compare-table td {
      padding: 20px;
      border-bottom: 1px solid var(--border-1);
      border-right: 1px solid var(--border-1);
      vertical-align: top;
    }
    .compare-table th:last-child, .compare-table td:last-child {
      border-right: none;
    }

    .compare-table th {
      background: var(--bg-surface);
      font-weight: 600;
      color: var(--text-200);
      width: 180px;
      font-size: 0.85rem;
    }

    .compare-table td {
      width: calc((100% - 180px) / 3);
      color: var(--text-100);
      font-size: 0.9rem;
    }

    .c-prod-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: var(--r-md);
      margin-bottom: 16px;
      background: var(--bg-secondary);
    }

    .c-prod-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-100);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .c-prod-price {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--gold-400);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<nav class="navbar" id="main-navbar">
  <div class="nav-container">
    <a href="../index.html" class="nav-logo">
      <div class="logo-mark">
        <svg class="logo-icon-svg" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
      <span class="logo-text">PixelVault</span>
    </a>
    <div class="nav-links">
      <a href="../index.html" class="nav-link">Trang chủ</a>
      <a href="products.html" class="nav-link">Sản phẩm</a>
      <a href="compare.html" class="nav-link active">So sánh</a>
      <a href="contact.html" class="nav-link">Liên hệ</a>
    </div>
                <div class="nav-actions">
      <div class="nav-search" id="nav-search-bar">
        <input class="nav-search-input" id="nav-q" placeholder="Tìm kiếm máy ảnh..." 
          onkeypress="if(event.key==='Enter') window.location.href='products.html?q='+this.value">
        <button class="nav-search-btn" id="btn-nav-search"
          onclick="window.location.href='products.html?q='+document.getElementById('nav-q').value">
          <svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </div>
      <button class="nav-icon-btn" onclick="toggleTheme()" title="Đổi giao diện" aria-label="Đổi giao diện">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <button class="nav-icon-btn" id="btn-cart" onclick="cartOpen()" title="Giỏ hàng" aria-label="Giỏ hàng">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-badge" id="cart-badge-nav" style="display:none;">0</span>
      </button>
      
      <div style="position:relative;" id="user-menu-container">
        <button class="nav-icon-btn" id="btn-user" style="display:none;" title="Tài khoản" onclick="toggleUserDropdown()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
        <div class="user-dropdown" id="user-dropdown" style="display:none; position:absolute; top:50px; right:0; background:var(--bg-elevated); border:1px solid var(--border-1); border-radius:var(--r-md); padding:8px 0; min-width:180px; flex-direction:column; box-shadow:var(--shadow-lg); z-index:100;">
          <a href="account.html" id="user-dropdown-name" style="padding:10px 16px; color:var(--text-200); text-decoration:none; font-size:0.9rem;" onmouseover="this.style.background='var(--bg-card)'" onmouseout="this.style.background='transparent'">Tài khoản của tôi</a>
          <div style="height:1px; background:var(--border-1); margin:4px 0;"></div>
          <a href="#" onclick="logout()" style="padding:10px 16px; color:var(--danger); text-decoration:none; font-size:0.9rem;" onmouseover="this.style.background='var(--bg-card)'" onmouseout="this.style.background='transparent'">Đăng xuất</a>
        </div>
      </div>

      <button class="btn btn-nav-login" id="btn-login" onclick="openModal('auth-modal')">Đăng nhập</button>
    </div>
  </div>
</nav>

<div class="section" style="margin-top: var(--nav-h); min-height: 60vh;">
  <div class="container">
    <div class="section-header" style="text-align:left; margin-bottom:32px;">
      <h1 class="section-title">So Sánh Sản Phẩm</h1>
      <p class="section-desc" style="margin:0;">Đối chiếu chi tiết thông số kỹ thuật để tìm ra thiết bị phù hợp nhất.</p>
    </div>

    <div id="compare-content"></div>
  </div>
</div>

<footer class="footer">
  <div class="footer-bottom">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; font-size:0.79rem; color:var(--text-500);">
      <span>© 2026 PixelVault. Đề án môn học.</span>
    </div>
  </div>
</footer>

<div class="cart-overlay" id="cart-overlay">
  <div class="cart-drawer">
    <div class="cart-header">
      <h3>Giỏ hàng</h3>
      <button class="cart-close" onclick="cartClose()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
      <div id="cart-total"></div>
      <a href="checkout.html" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:14px;">Thanh toán</a>
    </div>
  </div>
</div>

<div class="modal-overlay" id="auth-modal">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header">
      <div class="modal-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      <h2 class="modal-title">Đăng nhập</h2>
    </div>
    <div class="modal-body">
      <form id="login-form">
        <div class="form-group"><input type="email" id="login-email" class="form-input" placeholder="Email"></div>
        <div class="form-group"><input type="password" id="login-password" class="form-input" placeholder="Mật khẩu"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Đăng nhập</button>
      </form>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/main.js"></script>
<script>
document.addEventListener('store:ready', () => {
  renderCompareTable();
});

function renderCompareTable() {
  const container = document.getElementById('compare-content');
  const ids = Store.compareList;

  if (ids.length === 0) {
    container.innerHTML = `
      <div style="text-align:center; padding:80px 20px; background:var(--bg-card); border-radius:var(--r-lg); border:1px solid var(--border-1);">
        <svg style="width:64px;height:64px;stroke:var(--text-400);fill:none;stroke-width:1;margin:0 auto 16px;display:block;" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        <h3 style="font-family:'Outfit',sans-serif; font-size:1.25rem; font-weight:700; color:var(--text-100); margin-bottom:8px;">Chưa có sản phẩm nào</h3>
        <p style="font-size:0.875rem; color:var(--text-400); margin-bottom:20px;">Vui lòng thêm ít nhất một sản phẩm vào danh sách so sánh.</p>
        <a href="products.html" class="btn btn-primary">Chọn sản phẩm</a>
      </div>
    `;
    return;
  }

  const products = ids.map(id => Store.products.find(p => p.id === id)).filter(Boolean);
  
  // Extract all unique specs keys
  const allSpecs = new Set();
  products.forEach(p => {
    Object.keys(p.specs).forEach(k => allSpecs.add(k));
  });

  const specKeys = Array.from(allSpecs);

  let html = `
    <div class="compare-table-wrapper">
      <table class="compare-table">
        <tbody>
          <tr>
            <th>Sản phẩm</th>
            ${products.map(p => `
              <td>
                <div style="position:relative;">
                  <button class="btn btn-sm" style="position:absolute; top:8px; right:8px; background:rgba(6,6,13,0.6); backdrop-filter:blur(4px); padding:4px; border:1px solid rgba(255,255,255,0.1);" onclick="removeCompare(${p.id})">
                    <svg style="width:14px;height:14px;stroke:#fff;fill:none;" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                  </button>
                  <img src="${p.images[0].startsWith('assets') ? '../' + p.images[0] : p.images[0]}" class="c-prod-img" alt="${p.name}">
                </div>
                <div class="c-prod-name">${p.name}</div>
                <div class="c-prod-price">${formatPrice(p.price)}</div>
                <button class="btn btn-primary btn-sm" style="width:100%; justify-content:center;" onclick="cartAdd(${p.id}, 1)">Thêm vào giỏ</button>
                <a href="product-detail.html?id=${p.id}" class="btn btn-secondary btn-sm" style="width:100%; justify-content:center; margin-top:8px;">Chi tiết</a>
              </td>
            `).join('')}
            ${products.length < 3 ? `
              <td style="vertical-align:middle; text-align:center;">
                <a href="products.html" class="btn btn-ghost" style="border:1px dashed var(--border-2); width:100%; height:100%; min-height:200px; display:flex; flex-direction:column; justify-content:center; align-items:center; color:var(--text-400);">
                  <svg style="width:24px;height:24px;margin-bottom:8px;" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  Thêm sản phẩm
                </a>
              </td>
            ` : ''}
          </tr>
          <tr>
            <th>Thương hiệu</th>
            ${products.map(p => `<td><strong style="color:var(--gold-400);">${p.brand}</strong></td>`).join('')}
            ${products.length < 3 ? `<td></td>` : ''}
          </tr>
          <tr>
            <th>Danh mục</th>
            ${products.map(p => `<td style="text-transform:capitalize;">${p.category}</td>`).join('')}
            ${products.length < 3 ? `<td></td>` : ''}
          </tr>
          <tr>
            <th>Đánh giá</th>
            ${products.map(p => `
              <td>
                <div style="display:flex; align-items:center; gap:4px; color:var(--gold-400);">
                  ${'<svg style="width:14px;height:14px;fill:currentColor;stroke:none;" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'.repeat(Math.round(p.rating))}
                  <span style="color:var(--text-400); font-size:0.8rem; margin-left:4px;">(${p.reviews})</span>
                </div>
              </td>
            `).join('')}
            ${products.length < 3 ? `<td></td>` : ''}
          </tr>
          ${specKeys.map(key => `
            <tr>
              <th>${key}</th>
              ${products.map(p => `<td>${p.specs[key] || '-'}</td>`).join('')}
              ${products.length < 3 ? `<td></td>` : ''}
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  container.innerHTML = html;
}

function removeCompare(id) {
  Store.compareList = Store.compareList.filter(x => x !== id);
  saveStore();
  renderCompareTable();
  updateCompareBar();
}
</script>
</body>
</html>
